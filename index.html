<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Fotografico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Inter, sans-serif;
  background: #fff;
  color:#111;
}

/* HEADER */
header {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

/* 👇 NOME PIÙ PICCOLO */
h1 {
  font-size:42px;
  font-weight:700;
  color:#000;
}

/* FOTOGRAFIA PICCOLO */
h2 {
  font-size:14px;
  letter-spacing:4px;
  color:#666;
  margin-top:8px;
  font-weight:400;
}

/* 👇 SOLO 2 RIGHE CENTRATE */
.desc {
  margin-top:20px;
  font-size:18px;
  color:#444;
  max-width:420px;
  text-align:center;
  line-height:1.4;
}

/* GRID FOTO */
.gallery {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:40px;
}

.gallery img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s ease;
}

.gallery img:hover {
  transform:scale(1.02);
}

/* LIGHTBOX (BIANCO COME CHIESTO) */
.lightbox {
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  visibility:hidden;
  transition:0.2s ease;
}

.lightbox.active {
  opacity:1;
  visibility:visible;
}

/* BASE IMAGE */
.lightbox img {
  max-width:95%;
  max-height:95%;
  object-fit:contain;
  transition:transform 0.25s ease;
  cursor:zoom-in;
}

/* FULLSCREEN VISIVO */
.lightbox.zoomed img {
  max-width:100%;
  max-height:100%;
  transform:scale(1);
  cursor:zoom-out;
}

/* NAV */
.close, .nav {
  position:absolute;
  font-size:28px;
  cursor:pointer;
  user-select:none;
  color:#111;
}

.close { top:20px; right:25px; }
.prev { left:20px; top:50%; transform:translateY(-50%); }
.next { right:20px; top:50%; transform:translateY(-50%); }

</style>
</head>

<body>

<header>
  <h1>Tommaso Conti</h1>
  <h2>FOTOGRAFIA</h2>

  <div class="desc">
    le mie immagini<br>
    il mio sguardo sul mondo
  </div>
</header>

<section class="gallery">

  <img src="IMG_1263_VSCO.jpeg">
  <img src="IMG_1279_VSCO.jpeg">
  <img src="IMG_1256_VSCO.jpeg">
  <img src="IMG_2924.jpeg">
  <img src="Broooo.JPG">
  <img src="FullSizeRender_VSCO.jpeg">
  <img src="PARISinNigg*s.JPG">
  <img src="IMG_3066.jpeg">
  <img src="Fragolina.JPG">
  <img src="IMG_2758_VSCO.JPG">
  <img src="Dolcev.JPG">
  <img src="IMG_1303_VSCO.jpeg">
  <img src="IMG_1371_VSCO.jpeg">
  <img src="IMG_1461_VSCO.jpeg">
  <img src="IMG_1109_VSCO_VSCO.JPG">

</section>

<footer style="text-align:center; padding:40px; color:#888;">
© 2026 – Portfolio Fotografico
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="close" id="closeBtn">✕</div>
  <div class="nav prev" id="prev">&#10094;</div>
  <div class="nav next" id="next">&#10095;</div>
  <img id="lightbox-img">
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

const closeBtn = document.getElementById("closeBtn");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let index = 0;
let zoomed = false;

/* OPEN */
images.forEach((img,i)=>{
  img.addEventListener("click",()=>{
    index=i;
    open();
  });
});

function open(){
  lightbox.classList.add("active");
  update();
}

function update(){
  lightboxImg.src = images[index].src;
  resetZoom();
}

function close(){
  lightbox.classList.remove("active");
  resetZoom();
}

function next(){
  index = (index+1)%images.length;
  update();
}

function prev(){
  index = (index-1+images.length)%images.length;
  update();
}

function resetZoom(){
  zoomed = false;
  lightbox.classList.remove("zoomed");
}

/* CLICK = FULLSCREEN VISIVO TOGGLE */
lightboxImg.addEventListener("click",(e)=>{
  e.stopPropagation();
  zoomed = !zoomed;
  lightbox.classList.toggle("zoomed");
});

/* EVENTS */
closeBtn.onclick = close;
nextBtn.onclick = next;
prevBtn.onclick = prev;

lightbox.onclick = e=>{
  if(e.target===lightbox) close();
};

/* SWIPE */
let startX=0;

lightbox.addEventListener("touchstart",e=>{
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend",e=>{
  let diff = startX - e.changedTouches[0].clientX;

  if(Math.abs(diff)>50){
    if(diff>0) next();
    else prev();
  }
});

/* KEYBOARD */
document.addEventListener("keydown",e=>{
  if(!lightbox.classList.contains("active")) return;

  if(e.key==="Escape") close();
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});
</script>

</body>
</html>
