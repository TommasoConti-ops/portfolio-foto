<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>Portfolio Fotografico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Inter, sans-serif;
  background: #fff;
  color:#111;
  overflow-x: hidden;
}

/* HEADER */
header {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1 {
  font-size:42px;
  font-weight:700;
  color:#000;
}

h2 {
  font-size:14px;
  letter-spacing:4px;
  color:#666;
  margin-top:8px;
  font-weight:400;
}

.desc {
  margin-top:20px;
  font-size:18px;
  color:#444;
  max-width:420px;
  text-align:center;
  line-height:1.4;
}

/* GRIGLIA STILE PINTEREST RIPRISTINATA */
.gallery {
  columns: 3;
  column-gap: 16px;
  padding: 40px;
}

@media (max-width: 900px) {
  .gallery { columns: 3; padding: 20px; column-gap: 12px; }
}
@media (max-width: 600px) {
  .gallery { columns: 2; padding: 12px; column-gap: 8px; }
}

.gallery img {
  width: 100% !important;
  height: auto !important;
  aspect-ratio: auto !important;
  display: block;
  margin-bottom: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

@media (max-width: 600px) {
  .gallery img { margin-bottom: 8px; border-radius: 6px; }
}

.gallery img:hover {
  transform: scale(1.02);
}

/* SEZIONE COMMENTI NUOVA */
.comments-section {
  max-width: 600px;
  margin: 60px auto;
  padding: 0 20px;
}

.comments-section h3 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.comment-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 30px;
}

.comment-form input, .comment-form textarea {
  font-family: Inter, sans-serif;
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.comment-form input:focus, .comment-form textarea:focus {
  border-color: #111;
}

.comment-form button {
  font-family: Inter, sans-serif;
  align-self: flex-start;
  background: #111;
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
}

.comment-form button:hover {
  background: #333;
}

.comments-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.comment-item {
  border-bottom: 1px solid #eee;
  padding-bottom: 15px;
}

.comment-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.comment-author {
  font-weight: 600;
  font-size: 14px;
}

.comment-date {
  color: #888;
  font-size: 12px;
}

.comment-body {
  font-size: 14px;
  color: #444;
  line-height: 1.5;
  word-break: break-word;
}

/* LIGHTBOX BOOTSTRAP-LIKE / ULTRA CLEAN */
.lightbox {
  position: fixed;
  inset: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  z-index: 9999;
  overflow: hidden;
  touch-action: none;
}

.lightbox.active {
  opacity: 1;
  visibility: visible;
}

/* Area di contenimento dello zoom e del trascinamento */
.lightbox-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  will-change: transform;
}

/* Immagine con taglio netto professionale, senza ombre o curve */
.lightbox img {
  max-width: 85%;
  max-height: 80%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  border-radius: 0px !important;
  box-shadow: none !important;
  transition: max-width 0.25s ease, max-height 0.25s ease, transform 0.2s ease-out;
  transform-origin: center center;
  will-change: transform;
  cursor: pointer;
}

/* Clic Singolo -> Immagine a Schermo Intero */
.lightbox.fullscreen img {
  max-width: 100%;
  max-height: 100%;
}

/* Stato di Zoom Attivo (Doppio Tap/Clic) */
.lightbox.zoomed img {
  cursor: move;
}

/* INTERFACCIA ESTERNA ISOLATA */
.close, .nav {
  position: absolute;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  color: #111;
  z-index: 10010;
  background: rgba(245, 245, 245, 0.9);
  border: 1px solid #ddd;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.close:hover, .nav:hover { background: #e5e5e5; }

.close { top: 30px; right: 30px; }
.prev { left: 30px; top: 50%; transform: translateY(-50%); }
.next { right: 30px; top: 50%; transform: translateY(-50%); }

@media (max-width: 768px) {
  .nav { display: none; }
  .close { top: 20px; right: 20px; width: 44px; height: 44px; }
}
</style>
</head>

<body>

<header>
  <h1>Tommaso Conti</h1>
  <h2>FOTOGRAFIA</h2>

  <div class="desc">
    le mie immagini,<br>
    il mio sguardo sul mondo
  </div>
</header>

<section class="gallery">
  <img src="IMG_1263_VSCO.jpeg">
  <img src="IMG_1279_VSCO.jpeg">
  <img src="IMG_1256_VSCO.jpeg">
  <img src="PARISinNigg*s.JPG">
  <img src="IMG_2924.jpeg">
  <img src="Broooo.JPG">
  <img src="IMG_2758_VSCO.JPG">
  <img src="Dolcev.JPG">
  <img src="FullSizeRender_VSCO.jpeg">
  <img src="IMG_3066.jpeg">
  <img src="IMG_1303_VSCO.jpeg">
  <img src="IMG_1371_VSCO.jpeg">
  <img src="IMG_1461_VSCO.jpeg">
  <img src="IMG_1109_VSCO_VSCO.JPG">
  <img src="Quadro.JPG">
  <img src="IMG_1067_VSCO_VSCO.jpeg">
  <img src="IMG_6669_VSCO.jpeg">
  <img src="IMG_2961_VSCO.jpeg">
  <img src="Fragolina.JPG">
  <img src="IMG_2276_VSCO.jpeg">
  <img src="Princi.JPG">
</section>

<!-- SEZIONE COMMENTI AGGIUNTA -->
<section class="comments-section">
  <h3>Lascia un commento</h3>
  <form class="comment-form" id="commentForm">
    <input type="text" id="nickname" placeholder="Il tuo nome o nickname (lascia vuoto per anonimo)" maxlength="40">
    <textarea id="commentText" placeholder="Scrivi qui il tuo pensiero..." rows="4" required></textarea>
    <button type="submit">Invia commento</button>
  </form>

  <div class="comments-list" id="commentsList">
    <!-- I commenti compariranno qui -->
  </div>
</section>

<footer style="text-align:center; padding:40px; color:#888;">
© 2026 – Portfolio Fotografico
</footer>

<div class="lightbox" id="lightbox">
  <div class="close" id="closeBtn">✕</div>
  <div class="nav prev" id="prev">&#10094;</div>
  <div class="nav next" id="next">&#10095;</div>
  <div class="lightbox-wrapper" id="wrapper">
    <img id="lightbox-img" alt="Portfolio Image">
  </div>
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const wrapper = document.getElementById("wrapper");

const closeBtn = document.getElementById("closeBtn");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let index = 0;
let isFullscreen = false;
let isZoomed = false;
let lastTap = 0;
let clickTimeout;

// Logica di spostamento (Pan) e Swipe
let startX = 0, startY = 0;
let currentX = 0, currentY = 0;
let translateX = 0, translateY = 0;
let isDragging = false;
let zoomScale = 1;

images.forEach((img, i) => {
    img.addEventListener("click", () => {
        index = i;
        openLightbox();
    });
});

function openLightbox() {
    lightbox.classList.add("active");
    updateImage();
}

function updateImage() {
    lightboxImg.src = images[index].src;
    resetState();
}

function closeLightbox() {
    lightbox.classList.remove("active");
    resetState();
}

function next() {
    if (isZoomed) return;
    index = (index + 1) % images.length;
    updateImage();
}

function prev() {
    if (isZoomed) return;
    index = (index - 1 + images.length) % images.length;
    updateImage();
}

function resetState() {
    isFullscreen = false;
    isZoomed = false;
    zoomScale = 1;
    currentX = 0; currentY = 0;
    translateX = 0; translateY = 0;
    lightbox.classList.remove("fullscreen", "zoomed");
    lightboxImg.style.transform = `scale(1)`;
    wrapper.style.transform = `translate(0px, 0px)`;
}

/* ==========================================
   ZOOM FLUIDO GESTITO IN JAVASCRIPT (SIA CENTRATO CHE FULLSCREEN)
   ========================================== */
function toggleZoom(e) {
    isZoomed = !isZoomed;
    if (isZoomed) {
        zoomScale = 2.5; // Moltiplicatore zoom fluido
        lightbox.classList.add("zoomed");
        lightboxImg.style.transform = `scale(${zoomScale})`;
    } else {
        resetState();
    }
}

lightboxImg.addEventListener("click", (e) => {
    e.stopPropagation();
    const now = new Date().getTime();
    const timespan = now - lastTap;

    if (timespan < 300 && timespan > 0) {
        // DOPPIO TAP / DOPPIO CLIC -> ZOOM IN QUALSIASI STATO
        clearTimeout(clickTimeout);
        toggleZoom(e);
    } else {
        // CLIC SINGOLO -> ALTERNA SCHERMO INTERO NATURALE / CENTRATO
        clickTimeout = setTimeout(() => {
            if (!isZoomed) {
                isFullscreen = !isFullscreen;
                if (isFullscreen) {
                    lightbox.classList.add("fullscreen");
                } else {
                    lightbox.classList.remove("fullscreen");
                }
            }
        }, 250);
    }
    lastTap = now;
});

/* ==========================================
   GESTIONE DEI MOVIMENTI (TRASLAZIONE ZOOM ED EVITAMENTO BUG SWIPE)
   ========================================== */
lightbox.addEventListener("touchstart", (e) => {
    isDragging = true;
    if (isZoomed) {
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
    } else {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }
});

lightbox.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    if (isZoomed) {
        // Muove la foto dentro lo zoom (Pan) senza cambiare immagine
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        wrapper.style.transform = `translate(${translateX}px, ${translateY}px)`;
    } else {
        // Tracciamento temporaneo dello swipe standard
        currentX = e.touches[0].clientX - startX;
    }
});

lightbox.addEventListener("touchend", (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (!isZoomed) {
        // Cambia foto con lo swipe solo se NON siamo in modalità zoom
        if (Math.abs(currentX) > 70) {
            if (currentX < 0) next(); else prev();
        }
    }
    currentX = 0;
});

/* TRASCINAMENTO MOUSE SU DESKTOP QUANDO ZOOMATO */
lightbox.addEventListener("mousedown", (e) => {
    if (!isZoomed) return;
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging || !isZoomed) return;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    wrapper.style.transform = `translate(${translateX}px, ${translateY}px)`;
});

window.addEventListener("mouseup", () => { isDragging = false; });

/* CONTROLLI LIGHTBOX */
closeBtn.onclick = closeLightbox;
nextBtn.onclick = next;
prevBtn.onclick = prev;

lightbox.onclick = (e) => {
    if (e.target === lightbox || e.target === wrapper) {
        closeLightbox();
    }
};

document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
});

/* ==========================================
   LOGICA DELLA SEZIONE COMMENTI (LOCALSTORAGE)
   ========================================== */
const commentForm = document.getElementById("commentForm");
const commentsList = document.getElementById("commentsList");

// Carica i commenti esistenti all'avvio della pagina
document.addEventListener("DOMContentLoaded", loadComments);

commentForm.addEventListener("submit", (e) => {
    e.preventDefault();
    
    const nicknameInput = document.getElementById("nickname").value.trim();
    const commentText = document.getElementById("commentText").value.trim();
    
    // Se il nickname è vuoto, viene impostato di default come "Anonimo"
    const author = nicknameInput ? nicknameInput : "Anonimo";
    
    const date = new Date().toLocaleDateString("it-IT", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });

    const newComment = { author, text: commentText, date };
    
    saveComment(newComment);
    appendCommentDOM(newComment);
    
    commentForm.reset();
});

function saveComment(comment) {
    let comments = localStorage.getItem("portfolio_comments") 
        ? JSON.parse(localStorage.getItem("portfolio_comments")) 
        : [];
    comments.push(comment);
    localStorage.setItem("portfolio_comments", JSON.stringify(comments));
}

function loadComments() {
    let comments = localStorage.getItem("portfolio_comments") 
        ? JSON.parse(localStorage.getItem("portfolio_comments")) 
        : [];
    comments.forEach(comment => appendCommentDOM(comment));
}

function appendCommentDOM(comment) {
    const commentItem = document.createElement("div");
    commentItem.classList.add("comment-item");
    
    commentItem.innerHTML = `
        <div class="comment-header">
            <span class="comment-author">${escapeHTML(comment.author)}</span>
            <span class="comment-date">${comment.date}</span>
        </div>
        <div class="comment-body">${escapeHTML(comment.text)}</div>
    `;
    
    // Mostra l'ultimo commento in alto
    commentsList.insertBefore(commentItem, commentsList.firstChild);
}

// Funzione di sicurezza elementare per prevenire injection di codice malevolo nei commenti
function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}
</script>

</body>
</html>
