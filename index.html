<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Portfolio Fotografico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Inter, sans-serif;
  background: #fff;
  color:#111;
  overflow-x: hidden;
}

/* HEADER */
header {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1 {
  font-size:42px;
  font-weight:700;
  color:#000;
}

h2 {
  font-size:14px;
  letter-spacing:4px;
  color:#666;
  margin-top:8px;
  font-weight:400;
}

.desc {
  margin-top:20px;
  font-size:18px;
  color:#444;
  max-width:420px;
  text-align:center;
  line-height:1.4;
}

/* COLONNE FLUIDE (STILE PINTEREST)
   Garantisce che nessuna immagine venga tagliata a quadrato 
*/
.gallery {
  columns: 3;
  column-gap: 20px;
  padding: 40px;
}

@media (max-width: 900px) {
  .gallery { columns: 2; padding: 20px; }
}
@media (max-width: 600px) {
  .gallery { columns: 1; padding: 15px; }
}

.gallery img {
  width: 100% !important;
  height: auto !important; /* Forza il browser a usare l'altezza proporzionale nativa */
  aspect-ratio: auto !important; /* Rimuove qualsiasi vincolo quadrato precedente */
  display: block;
  margin-bottom: 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.gallery img:hover {
  transform: scale(1.02);
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  z-index: 9999;
  overflow: hidden;
  touch-action: none;
}

.lightbox.active {
  opacity: 1;
  visibility: visible;
}

/* Contenitore di movimento */
.lightbox-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  will-change: transform;
}

/* STEP 1: Immagine a grandezza naturale proporzionata dentro lo schermo (Non a schermo intero) */
.lightbox img {
  max-width: 85%;
  max-height: 80%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  transition: transform 0.35s cubic-bezier(0.15, 1, 0.3, 1), max-width 0.35s, max-height 0.35s;
  transform-origin: center center;
  will-change: transform;
  cursor: zoom-in;
}

/* STEP 2: Schermo intero con Zoom Fluido attivo */
.lightbox.zoomed img {
  max-width: 100%;
  max-height: 100%;
  transform: scale(2.2); /* Ingrandimento fluido */
  cursor: zoom-out;
}

/* INTERFACCIA E PULSANTI ISOLATI */
.close, .nav {
  position: absolute;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  color: #111;
  z-index: 10010;
  background: rgba(245, 245, 245, 0.9);
  border: 1px solid #ddd;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.2s;
}

.close:hover, .nav:hover {
  background: #e5e5e5;
}

/* Posizionata fissa in alto a destra fuori dalle scatole */
.close { 
  top: 30px; 
  right: 30px; 
}

.prev { left: 30px; top: 50%; transform: translateY(-50%); }
.next { right: 30px; top: 50%; transform: translateY(-50%); }

@media (max-width: 768px) {
  .nav { display: none; } /* Su mobile si usano le gesture (Swipe e Tap) */
  .close { top: 20px; right: 20px; width: 44px; height: 44px; }
}

</style>
</head>

<body>

<header>
  <h1>Tommaso Conti</h1>
  <h2>FOTOGRAFIA</h2>

  <div class="desc">
    le mie immagini,<br>
    il mio sguardo sul mondo
  </div>
</header>

<section class="gallery">
  <img src="IMG_1263_VSCO.jpeg">
  <img src="IMG_1279_VSCO.jpeg">
  <img src="IMG_1256_VSCO.jpeg">
  <img src="IMG_2924.jpeg">
  <img src="Broooo.JPG">
  <img src="FullSizeRender_VSCO.jpeg">
  <img src="PARISinNigg*s.JPG">
  <img src="IMG_3066.jpeg">
  <img src="Fragolina.JPG">
  <img src="IMG_2758_VSCO.JPG">
  <img src="Dolcev.JPG">
  <img src="IMG_1303_VSCO.jpeg">
  <img src="IMG_1371_VSCO.jpeg">
  <img src="IMG_1461_VSCO.jpeg">
  <img src="IMG_1109_VSCO_VSCO.JPG">
</section>

<footer style="text-align:center; padding:40px; color:#888;">
© 2026 – Portfolio Fotografico
</footer>

<div class="lightbox" id="lightbox">
  <div class="close" id="closeBtn">✕</div>
  <div class="nav prev" id="prev">&#10094;</div>
  <div class="nav next" id="next">&#10095;</div>
  <div class="lightbox-wrapper" id="wrapper">
    <img id="lightbox-img" alt="Portfolio Image">
  </div>
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const wrapper = document.getElementById("wrapper");

const closeBtn = document.getElementById("closeBtn");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let index = 0;
let isZoomed = false;
let lastTap = 0;

// Variabili di tracciamento posizioni (Swipe & Trasinamento Pan)
let startX = 0, startY = 0;
let currentX = 0, currentY = 0;
let isDragging = false;

images.forEach((img, i) => {
    img.addEventListener("click", () => {
        index = i;
        openLightbox();
    });
});

function openLightbox() {
    lightbox.classList.add("active");
    updateImage();
}

function updateImage() {
    lightboxImg.src = images[index].src;
    resetZoom();
}

function closeLightbox() {
    lightbox.classList.remove("active");
    resetZoom();
}

function next() {
    if (isZoomed) return;
    index = (index + 1) % images.length;
    updateImage();
}

function prev() {
    if (isZoomed) return;
    index = (index - 1 + images.length) % images.length;
    updateImage();
}

function resetZoom() {
    isZoomed = false;
    currentX = 0;
    currentY = 0;
    lightbox.classList.remove("zoomed");
    wrapper.style.transform = `translate(0px, 0px)`;
}

/* ==========================================
   ZOOM DOPPIO LIVELLO (TAP / DOPPIO CLICK)
   ========================================== */
function toggleZoom() {
    if (isZoomed) {
        resetZoom();
    } else {
        isZoomed = true;
        lightbox.classList.add("zoomed");
    }
}

// Intercetta il doppio click o doppio tap su mobile
lightboxImg.addEventListener("click", (e) => {
    e.stopPropagation();
    const now = new Date().getTime();
    const timespan = now - lastTap;
    
    if (timespan < 300 && timespan > 0) {
        toggleZoom();
    } else {
        // Clic singolo alternativo per attivare lo zoom a schermo intero
        setTimeout(() => {
            if (new Date().getTime() - lastTap >= 300 && !isZoomed) {
                // Se fai un clic singolo standard puoi decidere se zoomare o no
            }
        }, 300);
    }
    lastTap = now;
});

// Supporto aggiuntivo per il click singolo per passare a schermo intero
lightboxImg.addEventListener("pointerdown", (e) => {
    // Rende l'esperienza fluida sia su desktop che mobile
});

/* ==========================================
   DRAG-PAN & SWIPE GESTURES
   ========================================== */
lightbox.addEventListener("touchstart", (e) => {
    if (e.touches.length > 1) return; 
    isDragging = true;
    startX = e.touches[0].clientX - currentX;
    startY = e.touches[0].clientY - currentY;
});

lightbox.addEventListener("touchmove", (e) => {
    if (!isDragging || e.touches.length > 1) return;
    
    currentX = e.touches[0].clientX - startX;
    currentY = e.touches[0].clientY - startY;

    if (isZoomed) {
        // Navigazione fluida a tutto schermo (Pan)
        wrapper.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }
});

lightbox.addEventListener("touchend", (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (!isZoomed) {
        // Se l'immagine è centrata al naturale, lo swipe cambia la foto
        const diffX = currentX;
        const diffY = currentY;

        if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0) prev(); else next();
        }
        currentX = 0;
        currentY = 0;
    }
});

/* INTERFACCIA DESKTOP (MOUSE DRAG QUANDO ZOOMATO) */
lightbox.addEventListener("mousedown", (e) => {
    if (!isZoomed || e.target !== lightboxImg) return;
    isDragging = true;
    startX = e.clientX - currentX;
    startY = e.clientY - currentY;
    lightboxImg.style.cursor = "grabbing";
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging || !isZoomed) return;
    currentX = e.clientX - startX;
    currentY = e.clientY - startY;
    wrapper.style.transform = `translate(${currentX}px, ${currentY}px)`;
});

window.addEventListener("mouseup", () => {
    if (!isDragging) return;
    isDragging = false;
    if(lightboxImg) lightboxImg.style.cursor = "zoom-out";
});

/* CONTROLLI DI CHIUSURA */
closeBtn.onclick = closeLightbox;
nextBtn.onclick = next;
prevBtn.onclick = prev;

lightbox.onclick = (e) => {
    if (e.target === lightbox || e.target === wrapper) {
        closeLightbox();
    }
};

document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
});
</script>

</body>
</html>
