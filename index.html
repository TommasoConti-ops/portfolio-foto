<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Fotografico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  color: #111;
  overflow-x: hidden;
}

/* HEADER (NON TOCCATO) */
header {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 64px;
  font-weight: 600;
  letter-spacing: -2px;
}

h2 {
  margin-top: 10px;
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 4px;
  color: #666;
}

.desc {
  margin-top: 25px;
  font-size: 18px;
  color: #444;
  line-height: 1.6;
  max-width: 520px;
}

/* GALLERY (solo sistemata disposizione) */
.gallery {
  column-count: 3;
  column-gap: 15px;
  padding: 40px;
}

.gallery img {
  width: 100%;
  margin-bottom: 15px;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.5s ease;
}

.gallery img.show {
  opacity: 1;
  transform: translateY(0);
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: 0.25s ease;
}

.lightbox.active {
  opacity: 1;
  visibility: visible;
}

/* 🔥 IMPORTANTE: niente zoom, SOLO fullscreen visivo */
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 0;
  transition: none;
}

/* NAV */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: white;
  cursor: pointer;
  user-select: none;
}

.prev { left: 20px; }
.next { right: 20px; }

.close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 28px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>Tommaso Conti</h1>
  <h2>FOTOGRAFIA</h2>

  <div class="desc">
    una selezione di immagini<br>
    che raccontano il mio sguardo sul mondo
  </div>
</header>

<section class="gallery">

  <img src="IMG_1263_VSCO.jpeg">
  <img src="IMG_1279_VSCO.jpeg">
  <img src="IMG_1256_VSCO.jpeg">
  <img src="IMG_2924.jpeg">
  <img src="Broooo.JPG">
  <img src="FullSizeRender_VSCO.jpeg">
  <img src="PARISinNigg*s.JPG">
  <img src="IMG_3066.jpeg">
  <img src="Fragolina.JPG">
  <img src="IMG_2758_VSCO.JPG">
  <img src="Dolcev.JPG">
  <img src="IMG_1303_VSCO.jpeg">
  <img src="IMG_1371_VSCO.jpeg">
  <img src="IMG_1461_VSCO.jpeg">
  <img src="IMG_1109_VSCO_VSCO.JPG">

</section>

<footer style="text-align:center; padding:40px; color:#888;">
© 2026 – Portfolio Fotografico
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="close" id="closeBtn">✕</div>
  <div class="nav prev" id="prev">&#10094;</div>
  <div class="nav next" id="next">&#10095;</div>
  <img id="lightbox-img">
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

const closeBtn = document.getElementById("closeBtn");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let currentIndex = 0;

/* scroll animation */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting) e.target.classList.add("show");
  });
});

images.forEach((img, i) => {
  observer.observe(img);

  img.addEventListener("click", () => {
    currentIndex = i;
    openLightbox();
  });
});

function openLightbox(){
  lightbox.classList.add("active");
  updateImage();
}

function updateImage(){
  lightboxImg.src = images[currentIndex].src;
}

function closeLightbox(){
  lightbox.classList.remove("active");
}

function nextImage(){
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImage(){
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

closeBtn.addEventListener("click", closeLightbox);
nextBtn.addEventListener("click", nextImage);
prevBtn.addEventListener("click", prevImage);

lightbox.addEventListener("click", (e) => {
  if(e.target === lightbox) closeLightbox();
});

/* swipe */
let startX = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let diff = startX - e.changedTouches[0].clientX;

  if(Math.abs(diff) > 50){
    if(diff > 0) nextImage();
    else prevImage();
  }
});
</script>

</body>
</html>
